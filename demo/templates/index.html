<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lumen · launch list</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: -apple-system, "Segoe UI", sans-serif; background: #0f1222; color: #f3f4f8; }
    main { width: min(440px, 90vw); text-align: center; }
    h1 { font-size: 2.6rem; margin: 0 0 .4rem; letter-spacing: -0.02em; }
    p { color: #a9adc6; font-size: 1.1rem; line-height: 1.5; margin: 0 0 2rem; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .9rem 1rem; border-radius: 10px; border: 1px solid #333a5c; background: #171b33; color: inherit; font-size: 1rem; }
    button { padding: .9rem 1.2rem; border: 0; border-radius: 10px; background: #7c5cff; color: white; font-size: 1rem; font-weight: 600; cursor: pointer; }
    small { display: block; margin-top: 1.2rem; color: #6b7091; }
  </style>
</head>
<body>
  <main>
    <h1>Lumen</h1>
    <p>Notes that link themselves. Launching in January.</p>
    <form method="post" action="/signup">
      <input type="email" name="email" placeholder="you@example.com" aria-label="Email">
      <button type="submit" id="cta">{{ cta }}</button>
    </form>
    {% if cta == "Get early access" %}
    <small class="note">The first 500 people get in before launch.</small>
    {% else %}
    <small class="note">We'll email you once, at launch.</small>
    {% endif %}
    <small>Demo app for Preflight. No emails are stored.</small>
  </main>
</body>
</html>
