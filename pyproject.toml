[project]
name = "flagsmith-preflight"
version = "0.1.0"
description = "Gates for Flagsmith experiments: preflight checks, a gated start, an honest readout and a gated ship."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
preflight = "preflight.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["preflight*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
